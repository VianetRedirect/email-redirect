name: Spirit Level APK

on:
  push:
    paths:
      - "spirit-level/**"
      - ".github/workflows/spirit-level.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: spirit-level
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        # Uses the keystore from repository secrets when present, so updates install over the old
        # version. Otherwise makes a throwaway key for this build.
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS_SECRET:-spiritlevel}" >> "$GITHUB_ENV"
            echo "Using keystore from secrets"
          else
            keytool -genkeypair -keystore "$KS" -storepass spiritlevel -keypass spiritlevel \
              -alias spiritlevel -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Spirit Level, O=Personal, C=GB"
            echo "KEYSTORE_PASSWORD=spiritlevel" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=spiritlevel" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=spiritlevel" >> "$GITHUB_ENV"
            echo "No ANDROID_KEYSTORE_BASE64 secret; using a throwaway key for this build"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SpiritLevel.apk
          ls -la SpiritLevel.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiritLevel-apk
          path: spirit-level/SpiritLevel.apk

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spirit-level-build-${{ github.run_number }}
          name: Spirit Level build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Spirit Level for Android (sideload).

            On your phone, download **SpiritLevel.apk** below, open it, and allow installs from your browser if asked.
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
          files: spirit-level/SpiritLevel.apk
