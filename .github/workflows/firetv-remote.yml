name: Fire Remote APK

on:
  push:
    paths:
      - "firetv-remote/**"
      - ".github/workflows/firetv-remote.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firetv-remote
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare signing key
        # Uses the keystore from repository secrets when present (so updates install over the old
        # version); otherwise makes a throwaway key for this build.
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS_SECRET:-fireremote}" >> "$GITHUB_ENV"
            echo "Using keystore from secrets"
          else
            keytool -genkeypair -keystore "$KS" -storepass fireremote -keypass fireremote \
              -alias fireremote -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Fire Remote, O=Personal, C=GB"
            echo "KEYSTORE_PASSWORD=fireremote" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=fireremote" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=fireremote" >> "$GITHUB_ENV"
            echo "No ANDROID_KEYSTORE_BASE64 secret; using a throwaway key for this build"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk FireRemote.apk
          ls -la FireRemote.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireRemote-apk
          path: firetv-remote/FireRemote.apk

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fire-remote-build-${{ github.run_number }}
          name: Fire Remote build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Fire Remote for Android (sideload).

            On your phone, download **FireRemote.apk** below, open it, and allow installs from your browser if asked.
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
          files: firetv-remote/FireRemote.apk
